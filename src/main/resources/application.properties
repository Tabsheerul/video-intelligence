spring.application.name=video-intelligence
server.port=8081

# Load environment variables from a .env file natively
spring.config.import=optional:file:.env[.properties]

# ==========================================
# Google Cloud Platform Setup
# ==========================================
spring.cloud.gcp.project-id=video-intelligence-api-507217

# ==========================================
# Spring AI - Google GenAI Configuration
# ==========================================
# Using Gemini Developer API (API Key mode) for local development.
# Get your free API key from: https://aistudio.google.com/api-keys
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY:your-api-key-here}
spring.ai.google.genai.project-id=video-intelligence-api-507217
spring.ai.google.genai.location=us-central1
spring.ai.google.genai.embedding.project-id=video-intelligence-api-507217
spring.ai.google.genai.embedding.location=us-central1

# Set the exact model we want to use for generating vectors
spring.ai.google.genai.embedding.options.model=text-embedding-004

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# Custom property for local temporary storage
video.storage.path=uploads/

# ==========================================
# Database Configuration (PostgreSQL + pgvector)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/video_search
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize the database using schema.sql
spring.sql.init.mode=always

# ==========================================
# Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=video-processing-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ==========================================
# Google Cloud Credentials
# ==========================================
# Set the path to your Google Cloud Service Account JSON key file.
# Alternatively, set the GOOGLE_APPLICATION_CREDENTIALS environment variable.
# spring.cloud.gcp.credentials.location=file:/path/to/your/service-account-key.json
